        gain.connect(ctx.destination);

          osc.frequency.setValueAtTime(140, ctx.currentTime);

              <span class="bg-slate-800 text-white px-2.5 py-1 rounded">👤 ${state.playerName}</span>
              <span class="text-amber-900">進度: ${state.currentIndex + 1} / 8</span>
              <span class="text-green-800">得分: ${state.score}</span>
              <span class="text-blue-800">⏱️ ${state.timer} 秒</span>
            </div>

            <!-- 題目內文卡片 -->
            <div class="bg-amber-50 border-4 border-amber-800 p-4 rounded mb-5 text-lg md:text-xl leading-relaxed shadow-inner">
              ${q.text.replace(q.word, `<span class="bg-yellow-300 text-red-700 px-1.5 py-0.5 rounded font-black border-2 border-red-500 underline decoration-wavy">${q.word}</span>`)}
            </div>

            <p class="font-black text-slate-800 text-base md:text-lg mb-3">
              請根據上文下理，推斷劃線詞語「<span class="text-red-700 font-black">${q.word}</span>」最正確的意思：
            </p>

            <!-- 4 個選項按鈕 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
              ${q.options.map((opt, idx) => `
                <button onclick="selectOption(${idx})" 
                  ${state.showClue ? 'disabled' : ''}
                  class="mc-button p-3.5 text-left font-bold text-base md:text-lg flex items-center space-x-3 ${state.selectedOption===idx ? (idx===q.answer?'mc-button-green':'bg-red-700 border-red-300'):''}">
                  <span class="bg-black text-white px-2 py-0.5 text-xs font-mono rounded"> ${String.fromCharCode(65+idx)} </span>
                  <span>${opt}</span>
                </button>
              `).join('')}
            </div>

            <!-- 線索解析與下一題按鈕 -->
            ${state.showClue ? `
              <div class="bg-blue-50 border-4 border-blue-600 p-4 text-blue-950 mb-4 rounded shadow-md">
                <p class="font-black text-blue-900 border-b-2 border-blue-300 pb-1 mb-2 text-base md:text-lg flex items-center">
                  <span>💡 上文下理線索解析：</span>
                </p>
                <p class="text-sm md:text-base leading-relaxed">${q.clue}</p>
              </div>
              <button onclick="nextQuestion()" class="mc-button mc-button-green w-full py-3.5 font-black text-xl">
                下一題 ➔
              </button>
            ` : ''}
          </div>
        `;
      } else if (state.screen === 'result') {
        app.innerHTML = `
          <div class="mc-panel p-6 text-center text-slate-900 max-w-lg mx-auto w-full">
            <h2 class="text-3xl md:text-4xl font-black mb-3 text-amber-900">🎉 冒險順利完成！</h2>
            <p class="text-slate-700 font-bold mb-5">恭喜你完成閱讀策略「詞意推斷」考驗！</p>

            <div class="bg-amber-50 border-4 border-amber-800 p-4 mb-6 rounded text-left space-y-2 text-base md:text-lg font-bold">
              <p>👤 探險家姓名：<strong class="text-slate-900">${state.playerName}</strong></p>
              <p>階梯難度：<span class="px-2 py-0.5 bg-slate-200 text-slate-800 rounded border border-slate-400">${state.difficulty==='easy'?'泥土 (初級)':state.difficulty==='medium'?'鐵礦 (中級)':'鑽石 (高級)'}</span></p>
              <p>⭐ 最終得分：<strong class="text-green-700 text-2xl">${state.score}</strong> / 800 分</p>
              <p>⏱️ 總共耗時：<strong class="text-blue-800">${state.timer} 秒</strong></p>
            </div>

            <div class="space-y-3">
              <button onclick="showLeaderboard()" class="mc-button mc-button-gold w-full py-3.5 font-black text-lg">
                🏆 上傳成績並查看全網龍虎榜
              </button>
              <button onclick="state.screen='welcome'; render();" class="mc-button w-full py-3 font-bold text-lg">
                🔄 返回主選單
              </button>
            </div>
          </div>
        `;
      } else if (state.screen === 'leaderboard') {
        app.innerHTML = `
          <div class="mc-panel p-5 md:p-6 text-slate-900 max-w-xl mx-auto w-full">
            <h2 class="text-2xl md:text-3xl font-black text-center mb-2 text-amber-900">
              🏆 全網跨裝置龍虎榜 (TOP 5)
            </h2>
            <p class="text-xs md:text-sm text-center mb-4 font-bold ${isCloudConnected ? 'text-green-700' : 'text-amber-700'}">
              ${isCloudConnected ? '🌐 已連線至 Firebase 雲端資料庫 (全網同步中)' : '📁 目前為本機紀錄模式'}
            </p>

            <div class="space-y-2 mb-6">
              ${state.leaderboardData.length === 0 ? '<p class="text-center text-slate-600 py-6 font-bold">資料加載中 / 暫無數據...</p>' : ''}
              ${state.leaderboardData.map((item, idx) => `
                <div class="flex justify-between items-center bg-amber-50 border-3 border-amber-900 p-3 font-bold text-sm md:text-base rounded shadow-sm">
                  <div class="flex items-center space-x-2">
                    <span class="text-xl w-7 text-center font-black">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`}</span>
                    <span class="text-slate-900 font-extrabold">${item.name || '無名氏'}</span>
                    <span class="text-xs px-2 py-0.5 bg-slate-200 text-slate-800 border border-slate-400 rounded">${item.difficulty === 'easy' ? '泥土' : item.difficulty === 'medium' ? '鐵礦' : '鑽石'}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-green-700 text-base md:text-lg font-black">${item.score}分</span>
                    <span class="text-xs text-slate-500 ml-1">(${item.time}s)</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <button onclick="state.screen='welcome'; render();" class="mc-button mc-button-blue w-full py-3.5 font-black text-lg">
              🏠 返回主頁
            </button>
          </div>
        `;
      }
    }

    // 綁定全域互動函數
    window.setDifficulty = (diff) => {
      playSound('click');
      state.difficulty = diff;
      render();
    };

    window.startGame = () => {
      const nameInput = document.getElementById('playerNameInput')?.value.trim();
      if (!nameInput) {
        alert('請先輸入探險家名字 (學生姓名)！');
        return;
      }
      playSound('click');
      state.playerName = nameInput;
      state.questions = [...QUESTION_BANK[state.difficulty]].sort(() => Math.random() - 0.5);
      state.currentIndex = 0;
      state.score = 0;
      state.timer = 0;
      state.selectedOption = null;
      state.showClue = false;
      state.screen = 'game';

      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.timer++;
        const timerEl = document.querySelector('#app .text-blue-800');
        if (timerEl) timerEl.innerText = `⏱️ ${state.timer} 秒`;
      }, 1000);

      render();
    };

    window.selectOption = (idx) => {
      if (state.showClue) return;
      state.selectedOption = idx;
      const q = state.questions[state.currentIndex];
      state.showClue = true;

      if (idx === q.answer) {
        playSound('correct');
        state.score += 100;
      } else {
        playSound('wrong');
      }
      render();
    };

    window.nextQuestion = () => {
      playSound('click');
      if (state.currentIndex < 7) {
        state.currentIndex++;
        state.selectedOption = null;
        state.showClue = false;
        render();
      } else {
        clearInterval(state.timerInterval);
        state.screen = 'result';
        saveScore();
        render();
      }
    };

    // 寫入成績 (雲端 Firestore + 本機 localStorage 雙重備份)
    async function saveScore() {
      const record = {
        name: state.playerName,
        score: state.score,
        time: state.timer,
        difficulty: state.difficulty,
        timestamp: new Date().getTime()
      };

      // 1. 本機快取備份
      let localScores = JSON.parse(localStorage.getItem('mc_chinese_scores') || '[]');
      localScores.push(record);
      localScores.sort((a,b) => b.score - a.score || a.time - b.time);
      localStorage.setItem('mc_chinese_scores', JSON.stringify(localScores.slice(0, 10)));

      // 2. 寫入 Firebase 雲端資料庫
      if (isCloudConnected && db) {
        try {
          await addDoc(collection(db, "leaderboard"), {
            name: record.name,
            score: record.score,
            time: record.time,
            difficulty: record.difficulty,
            createdAt: serverTimestamp()
          });
          console.log("成績已順利上傳至全網 Firebase 雲端資料庫！");
        } catch (e) {
          console.error("雲端寫入遇到阻礙，已自動儲存至本機:", e);
        }
      }
    }

    // 撈取全網 TOP 5 高分榜
    window.showLeaderboard = async () => {
      playSound('click');
      state.screen = 'leaderboard';
      state.leaderboardData = [];
      render();

      if (isCloudConnected && db) {
        try {
          // 從雲端 Firestore 取出最高分的 5 筆紀錄
          const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(5));
          const querySnapshot = await getDocs(q);
          const cloudData = [];
          querySnapshot.forEach((doc) => {
            cloudData.push(doc.data());
          });
          
          if (cloudData.length > 0) {
            state.leaderboardData = cloudData;
          } else {
            fallbackLocalLeaderboard();
          }
        } catch (e) {
          console.error("雲端撈取失敗，切換回本機資料:", e);
          fallbackLocalLeaderboard();
        }
      } else {
        fallbackLocalLeaderboard();
      }
      render();
    };

    function fallbackLocalLeaderboard() {
      const local = JSON.parse(localStorage.getItem('mc_chinese_scores') || '[]');
      state.leaderboardData = local.slice(0, 5);
    }

    // 初始化繪製
    render();
  </script>
</body>
</html>
