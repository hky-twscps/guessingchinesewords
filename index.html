    // 音效合成器
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.setValueAtTime(110, ctx.currentTime + 0.1);

                  <div class="text-right">
                    <span class="text-green-700">${item.score}分</span>
                    <span class="text-xs text-slate-500 ml-2">(${item.time}s)</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <button onclick="goHome()" class="mc-button w-full py-3 bg-blue-600 font-bold text-lg">
              🏠 返回主頁
            </button>
          </div>
        `;
      }
    }

    // 將互動邏輯註冊至全域 (window)
    window.goHome = () => {
      playSound('click');
      state.screen = 'welcome';
      render();
    };

    window.setDifficulty = (diff) => {
      playSound('click');
      state.difficulty = diff;
      render();
    };

    window.startGame = () => {
      const nameInput = document.getElementById('playerNameInput')?.value.trim();
      if (!nameInput) {
        alert('請先輸入探險家名字！');
        return;
      }
      playSound('click');
      state.playerName = nameInput;
      state.questions = [...QUESTION_BANK[state.difficulty]].sort(() => Math.random() - 0.5);
      state.currentIndex = 0;
      state.score = 0;
      state.timer = 0;
      state.selectedOption = null;
      state.showClue = false;
      state.screen = 'game';

      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.timer++;
        const timerEl = document.querySelector('#app .text-blue-800');
        if (timerEl) timerEl.innerText = `⏱️ ${state.timer}s`;
      }, 1000);

      render();
    };

    window.selectOption = (idx) => {
      if (state.showClue) return;
      state.selectedOption = idx;
      const q = state.questions[state.currentIndex];
      state.showClue = true;

      if (idx === q.answer) {
        playSound('correct');
        state.score += 100;
      } else {
        playSound('wrong');
      }
      render();
    };

    window.nextQuestion = () => {
      playSound('click');
      if (state.currentIndex < 7) {
        state.currentIndex++;
        state.selectedOption = null;
        state.showClue = false;
        render();
      } else {
        clearInterval(state.timerInterval);
        state.screen = 'result';
        saveScore();
        render();
      }
    };

    async function saveScore() {
      const record = {
        name: state.playerName,
        score: state.score,
        time: state.timer,
        difficulty: state.difficulty,
        timestamp: new Date().getTime()
      };

      let localScores = JSON.parse(localStorage.getItem('mc_chinese_scores') || '[]');
      localScores.push(record);
      localScores.sort((a,b) => b.score - a.score || a.time - b.time);
      localStorage.setItem('mc_chinese_scores', JSON.stringify(localScores.slice(0, 10)));

      if (isCloudConnected && db) {
        try {
          await addDoc(collection(db, "leaderboard"), {
            name: record.name,
            score: record.score,
            time: record.time,
            difficulty: record.difficulty,
            createdAt: serverTimestamp()
          });
        } catch (e) {
          console.error("雲端寫入失敗：", e);
        }
      }
    }

    window.showLeaderboard = async () => {
      playSound('click');
      state.screen = 'leaderboard';
      state.leaderboardData = [];
      render();

      if (isCloudConnected && db) {
        try {
          const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(5));
          const querySnapshot = await getDocs(q);
          const cloudData = [];
          querySnapshot.forEach((doc) => {
            cloudData.push(doc.data());
          });
          state.leaderboardData = cloudData;
        } catch (e) {
          console.error("雲端讀取失敗，讀取本機紀錄：", e);
          fallbackLocalLeaderboard();
        }
      } else {
        fallbackLocalLeaderboard();
      }
      render();
    };

    function fallbackLocalLeaderboard() {
      const local = JSON.parse(localStorage.getItem('mc_chinese_scores') || '[]');
      state.leaderboardData = local.slice(0, 5);
    }

    // 初始渲染遊戲畫面
    render();
  </script>
</body>
</html>
